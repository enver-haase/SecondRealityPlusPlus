plugins {
    id 'com.android.application'
}

// local.properties (untracked) holds sdk.dir and optionally your own applicationId
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def sdlDir = rootProject.file("_deps/SDL3-${sdlVersion}")

android {
    // SDL's activity lives in org.libsdl.app and is used as is
    namespace = 'org.libsdl.app'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = localProperties.getProperty('applicationId', 'com.example.secondreality')
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        externalNativeBuild {
            cmake {
                arguments "-DSDL3_DIR=${sdlDir}", '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    externalNativeBuild {
        cmake {
            path = file('CMakeLists.txt')
            version = '4.1.2'
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

tasks.named('preBuild') {
    doFirst {
        if (!sdlDir.exists()) {
            throw new GradleException("SDL3 sources missing: run Android/fetch-sdl3.sh first")
        }
    }
}
